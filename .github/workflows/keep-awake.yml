name: Keep AI Employee OS awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Render app (no database)
        run: curl -fsS -m 90 --retry 2 https://ai-employee-os-n7kh.onrender.com/api/ping || true
